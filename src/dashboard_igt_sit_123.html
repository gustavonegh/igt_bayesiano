<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría IGT</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { background-color: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; }
        
        /* Estilos para los botones de simulación */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: none; background: #bdc3c7; color: #2c3e50; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn:hover { background: #95a5a6; }
        .tab-btn.active { background: #3498db; color: white; }

        .kpi-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; text-align: center; border-top: 4px solid #3498db; }
        .kpi-card.success { border-top-color: #2ecc71; }
        .kpi-card.warning { border-top-color: #f39c12; }
        .kpi-title { font-size: 14px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; }
        .kpi-value { font-size: 36px; color: #2c3e50; font-weight: bold; margin: 10px 0 0 0; transition: color 0.3s; }
        .chart-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Panel de Administración: Proyecto IGT-Rioja</h1>
        <p style="margin: 5px 0 0 0; opacity: 0.8;" id="desc-simulacion">Módulo de Jurisprudencia - Mes 1 (Lanzamiento Base)</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-1" onclick="cambiarSimulacion(1)">Simulación 1 (Base)</button>
        <button class="tab-btn" id="btn-2" onclick="cambiarSimulacion(2)">Simulación 2 (Resistencia)</button>
        <button class="tab-btn" id="btn-3" onclick="cambiarSimulacion(3)">Simulación 3 (Éxito)</button>
    </div>

    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">Visitas Totales al Portal</div>
            <div class="kpi-value" id="val-visitas">2,500</div>
        </div>
        <div class="kpi-card success">
            <div class="kpi-title">Consultas de Jurisprudencia</div>
            <div class="kpi-value" id="val-consultas">415</div>
        </div>
        <div class="kpi-card warning">
            <div class="kpi-title">Tasa de Adopción Actual</div>
            <div class="kpi-value" id="val-tasa">16.6%</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="traficoChart" height="80"></canvas>
    </div>

    <script>
        // Datos de los 3 escenarios
        const escenarios = {
            1: {
                titulo: "Módulo de Jurisprudencia - Mes 1 (Lanzamiento Base)",
                visitas: "2,500", consultas: "415", tasa: "16.6%",
                dataVisitas: [210, 250, 230, 280, 220, 260, 240, 290, 270, 250],
                dataConsultas: [35, 42, 38, 48, 36, 45, 40, 47, 44, 40]
            },
            2: {
                titulo: "Módulo de Jurisprudencia - Mes 2 (Pico de Trabajo Judicial - Baja Adopción)",
                visitas: "5,000", consultas: "500", tasa: "10.0%",
                dataVisitas: [450, 520, 480, 550, 490, 510, 460, 530, 500, 510],
                dataConsultas: [45, 50, 48, 55, 49, 51, 46, 53, 50, 53]
            },
            3: {
                titulo: "Módulo de Jurisprudencia - Mes 3 (Post Capacitación del Personal)",
                visitas: "3,000", consultas: "850", tasa: "28.3%",
                dataVisitas: [280, 310, 290, 320, 300, 315, 285, 305, 295, 290],
                dataConsultas: [80, 90, 85, 95, 88, 92, 82, 89, 86, 83]
            }
        };

        // Inicializar el gráfico Chart.js
        const ctx = document.getElementById('traficoChart').getContext('2d');
        let traficoChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Día 1', 'Día 2', 'Día 3', 'Día 4', 'Día 5', 'Día 6', 'Día 7', 'Día 8', 'Día 9', 'Día 10'],
                datasets: [
                    { label: 'Visitas al Portal', data: escenarios[1].dataVisitas, borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', borderWidth: 2, fill: true, tension: 0.4 },
                    { label: 'Uso del Buscador IGT', data: escenarios[1].dataConsultas, borderColor: '#2ecc71', backgroundColor: 'rgba(46, 204, 113, 0.1)', borderWidth: 2, fill: true, tension: 0.4 }
                ]
            },
            options: { responsive: true, plugins: { title: { display: true, text: 'Tráfico diario simulado (Muestra de 10 días)' } }, scales: { y: { beginAtZero: true } } }
        });

        // Función para actualizar el dashboard al hacer clic
        function cambiarSimulacion(num) {
            // Actualizar botones
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + num).classList.add('active');

            // Actualizar textos y KPIs
            document.getElementById('desc-simulacion').innerText = escenarios[num].titulo;
            document.getElementById('val-visitas').innerText = escenarios[num].visitas;
            document.getElementById('val-consultas').innerText = escenarios[num].consultas;
            document.getElementById('val-tasa').innerText = escenarios[num].tasa;

            // Actualizar el gráfico
            traficoChart.data.datasets[0].data = escenarios[num].dataVisitas;
            traficoChart.data.datasets[1].data = escenarios[num].dataConsultas;
            traficoChart.update();
        }
    </script>
</body>
</html>
